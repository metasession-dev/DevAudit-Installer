name: Recover Required Checks

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number to inspect
        required: true
        type: number
      apply:
        description: Rerun resolvable stale or failed Actions runs
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read

jobs:
  recover:
    name: Diagnose and recover required checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Inspect current PR SHA and recover resolvable runs
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.apply && '--apply' || '--dry-run' }}
        run: |
          bash scripts/recover-required-checks.sh \
            "$GITHUB_REPOSITORY" \
            "${{ inputs.pull_request }}" \
            "$MODE"
