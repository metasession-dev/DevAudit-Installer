name: Hotfix Back-Merge

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  backmerge-hotfix:
    runs-on: ubuntu-latest
    steps:
      # devaudit-installer#613 — PRs opened with the default GITHUB_TOKEN
      # (actor github-actions[bot]) get their own pull_request-triggered
      # required checks (including Enforce GitFlow) stuck at
      # `action_required` instead of running, blocking every automated
      # backmerge PR until a maintainer manually approves each pending
      # workflow run. HOTFIX_BACKMERGE_PAT, if set, authenticates the
      # push/PR-create as a real, already-trusted account instead —
      # PRs opened that way aren't subject to this gate.
      #
      # HOTFIX_BACKMERGE_PAT must be created manually (Settings → Actions
      # is not sufficient here, and no API can mint a new PAT) — a classic
      # PAT with `repo` scope from an account with write access, or a
      # GitHub App installation token, added as a repository secret named
      # HOTFIX_BACKMERGE_PAT. Falls back to the default GITHUB_TOKEN
      # (today's unchanged, still-gated behavior) when unset, so this is
      # safe to merge before the secret exists.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.HOTFIX_BACKMERGE_PAT || github.token }}

      - name: Open develop back-merge PR for reviewed hotfix merges
        env:
          GH_TOKEN: ${{ secrets.HOTFIX_BACKMERGE_PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          git fetch origin main develop

          AFTER_PARENTS=$(git show -s --format='%P' "$AFTER" 2>/dev/null | wc -w)
          if [ "$AFTER_PARENTS" -lt 2 ]; then
            echo "Push to main is not a merge commit. No automated back-merge PR needed."
            exit 0
          fi

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            COMMITS=$(git rev-list "origin/develop..$AFTER" 2>/dev/null || true)
          else
            COMMITS=$(git rev-list "$BEFORE..$AFTER" --not origin/develop 2>/dev/null || true)
          fi

          HOTFIX_COMMITS=""
          SECOND_PARENT=$(git rev-parse "${AFTER}^2")
          if [ -n "$COMMITS" ]; then
            while IFS= read -r sha; do
              [ -z "$sha" ] && continue
              if git merge-base --is-ancestor "$sha" origin/develop 2>/dev/null; then
                continue
              fi
              PARENTS=$(git show -s --format='%P' "$sha" 2>/dev/null | wc -w)
              if [ "$PARENTS" -ge 2 ]; then
                continue
              fi
              if ! git merge-base --is-ancestor "$sha" "$SECOND_PARENT" 2>/dev/null; then
                echo "Commit $sha is not part of the merged hotfix branch. Skipping automated back-merge."
                exit 0
              fi
              HOTFIX_COMMITS="${HOTFIX_COMMITS}${sha}"$'\n'
            done <<< "$COMMITS"
          fi

          if [ -z "$HOTFIX_COMMITS" ]; then
            echo "No hotfix-only commits missing from develop. Nothing to back-merge."
            exit 0
          fi

          SHORT_SHA="${AFTER:0:7}"
          BACKMERGE_BRANCH="backmerge/main-${SHORT_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BACKMERGE_BRANCH" origin/develop

          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            git cherry-pick -x "$sha"
          done <<< "$(printf '%s' "$HOTFIX_COMMITS" | tac)"

          PUSH_LOG="$(mktemp)"
          if ! git push --force-with-lease origin "$BACKMERGE_BRANCH" 2> "$PUSH_LOG"; then
            cat "$PUSH_LOG" >&2
            echo "::error::Unable to push ${BACKMERGE_BRANCH} for hotfix back-merge." >&2
            echo "Hotfix back-merge requires workflow contents: write permission and branch creation access." >&2
            exit 1
          fi

          EXISTING_PR=$(gh pr list --base develop --head "$BACKMERGE_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Back-merge PR #$EXISTING_PR already exists."
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "Automated back-merge after a reviewed hotfix merged into \`main\`."
            echo
            echo "Source merge commit: \`$AFTER\`"
            echo
            echo "Cherry-picked commits:"
            while IFS= read -r sha; do
              [ -z "$sha" ] && continue
              echo "- \`$sha\` $(git log -1 --format='%s' "$sha")"
            done <<< "$HOTFIX_COMMITS"
            echo
            echo "This PR keeps \`develop\` aligned immediately after a permitted \`hotfix/* -> main\` merge."
          } > "$BODY_FILE"

          PR_CREATE_LOG="$(mktemp)"
          if ! gh pr create \
            --base develop \
            --head "$BACKMERGE_BRANCH" \
            --title "backmerge: sync main hotfix ${SHORT_SHA} into develop" \
            --body-file "$BODY_FILE" 2> "$PR_CREATE_LOG"; then
            cat "$PR_CREATE_LOG" >&2
            echo "::error::Unable to create the reviewed hotfix back-merge PR." >&2
            echo "If the error is 'Resource not accessible by integration' or HTTP 403, enable repository Actions setting 'Allow GitHub Actions to create and approve pull requests', keep workflow permissions at write, then rerun this workflow." >&2
            git push origin --delete "$BACKMERGE_BRANCH" 2>/dev/null || \
              echo "::warning::Could not remove temporary branch ${BACKMERGE_BRANCH}; remove it before retrying."
            exit 1
          fi
