name: CLI CI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'core/**'
      - 'plugin-sdk/**'
      - 'sdlc/files/**'
      - 'sdlc/src/**'
      - 'contracts/evidence-types.json'
      - 'contracts/frameworks/**'
      - '.github/workflows/cli.yml'
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / node ${{ matrix.node }})
    # Only the ubuntu-latest leg is switchable via CI_RUNNER_LABEL (repo
    # Actions variable) — macos-latest/windows-latest always stay on
    # GitHub-hosted runners, since this host has no macOS/Windows self-hosted
    # capability. See ostendo-workhorse-platform/docs/self-hosted-runner-ci.md
    # "The devaudit-installer cross-platform CLI matrix is an explicit
    # exception to single-runner selection."
    runs-on: ${{ matrix.os != 'ubuntu-latest' && matrix.os || (vars.CI_RUNNER_LABEL == 'github-ci' && 'ubuntu-latest' || vars.CI_RUNNER_LABEL || 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
    defaults:
      run:
        working-directory: cli
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect CLI test-surface changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "reason=push-to-main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"

          echo "Changed files between $BASE_SHA and $HEAD_SHA:"
          printf '%s\n' "$CHANGED"

          if printf '%s\n' "$CHANGED" | grep -Eq '^(cli/|core/|plugin-sdk/|sdlc/files/|sdlc/src/|contracts/evidence-types\.json$|\.github/workflows/cli\.yml$)'; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "reason=relevant-files-changed" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "reason=docs-or-unrelated-pr" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run_tests == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json
      - name: Build plugin-sdk (cli depends on it via file:)
        if: steps.changes.outputs.run_tests == 'true'
        working-directory: plugin-sdk
        run: |
          npm install --legacy-peer-deps
          npm run build
      # core is a file: dep of cli too (DevAudit-Installer#1116, WP1). Build it and run its own tests.
      - name: Build and test core (cli depends on it via file:)
        if: steps.changes.outputs.run_tests == 'true'
        working-directory: core
        run: |
          npm install --legacy-peer-deps
          npx tsc --noEmit
          npm run build
          npm test
      - if: steps.changes.outputs.run_tests == 'true'
        run: npm install --legacy-peer-deps
      - name: TypeScript
        if: steps.changes.outputs.run_tests == 'true'
        run: npx tsc --noEmit
      - name: Build
        if: steps.changes.outputs.run_tests == 'true'
        run: npm run build
      - name: Test
        if: steps.changes.outputs.run_tests == 'true'
        run: npm test
      - name: Smoke --help
        if: steps.changes.outputs.run_tests == 'true'
        run: node ./bin/devaudit.js --help
      - name: Smoke --version
        if: steps.changes.outputs.run_tests == 'true'
        run: node ./bin/devaudit.js --version
      - name: Docs-only success path
        if: steps.changes.outputs.run_tests != 'true'
        run: |
          echo "No CLI test-surface changes detected."
          echo "Marking required Test check green for docs-only or unrelated PR."

  # devaudit-installer#1091 D24 — every tarball holds what it must and nothing it must not. Runs only
  # on a pull request into main (the promotion PR), so it is just another green check there. It builds
  # the six packages the way release.yml does and then runs scripts/check-package-contents.sh.
  package-contents:
    name: Package contents
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ${{ vars.CI_RUNNER_LABEL == 'github-ci' && 'ubuntu-latest' || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: plugin-sdk — install + build
        working-directory: plugin-sdk
        run: |
          npm install --legacy-peer-deps
          npm run build
      - name: core — install + build
        working-directory: core
        run: |
          npm install --legacy-peer-deps
          npm run build
      - name: Plugins — install + build
        run: |
          for p in plugins/devaudit-plugin-prisma plugins/devaudit-plugin-evidence-export; do
            (cd "$p" && npm install --legacy-peer-deps && npm run build)
          done
      - name: cli — install (prepack builds and bundles it)
        working-directory: cli
        run: npm install --legacy-peer-deps
      - name: Check package contents
        run: bash scripts/check-package-contents.sh
