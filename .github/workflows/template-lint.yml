# DevAudit-Installer#571 — Source path lint check.
#
# Verifies that workflow templates use post-install paths (scripts/)
# not repo-relative template paths (sdlc/files/). When a template is
# synced into a consumer project, the scripts land at scripts/ not
# sdlc/files/_common/scripts/. A `source sdlc/files/…` statement
# silently fails at runtime because the path doesn't exist.
#
# Also runs the existing shell-script test suites to catch fallback
# chain regressions.

name: Template Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdlc/files/ci/**'
      - 'sdlc/files/_common/scripts/**'
      - 'sdlc/files/_common/skills/sdlc-implementer/**'
      - 'sdlc/files/stacks/node/hooks/pre-push'
      - 'sdlc/files/stacks/node/hooks/pre-push.test.sh'
      - 'docs/release-playbooks/**'
      - 'docs/change-workflows.md'
      - 'scripts/release-playbook-contract.test.sh'
      - 'scripts/release-routing-contract.test.sh'
      - 'scripts/action-runtime-contract.test.sh'
      - 'scripts/check-recovery-workflow.test.sh'
      - 'scripts/auto-merge-workflow.test.sh'
      - 'scripts/verify-auto-merge-checks.sh'
      - 'scripts/verify-auto-merge-checks.test.sh'
      - '.github/workflows/auto-merge.yml'
      - 'scripts/lint-shell-failure-modes.sh'
      - 'scripts/lint-shell-failure-modes.test.sh'
      - 'scripts/release-validation.sh'
      - 'scripts/release-validation.test.sh'
      - 'scripts/runner-host/**'
      - 'tests/release-pipeline-e2e/**'
      - '.github/workflows/template-lint.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'sdlc/files/ci/**'
      - 'sdlc/files/_common/scripts/**'
      - 'sdlc/files/_common/skills/sdlc-implementer/**'
      - 'sdlc/files/stacks/node/hooks/pre-push'
      - 'sdlc/files/stacks/node/hooks/pre-push.test.sh'
      - 'docs/release-playbooks/**'
      - 'docs/change-workflows.md'
      - 'scripts/release-playbook-contract.test.sh'
      - 'scripts/release-routing-contract.test.sh'
      - 'scripts/action-runtime-contract.test.sh'
      - 'scripts/check-recovery-workflow.test.sh'
      - 'scripts/auto-merge-workflow.test.sh'
      - 'scripts/verify-auto-merge-checks.sh'
      - 'scripts/verify-auto-merge-checks.test.sh'
      - '.github/workflows/auto-merge.yml'
      - 'scripts/lint-shell-failure-modes.sh'
      - 'scripts/lint-shell-failure-modes.test.sh'
      - 'scripts/release-validation.sh'
      - 'scripts/release-validation.test.sh'
      - 'scripts/runner-host/**'
      - 'tests/release-pipeline-e2e/**'
      - '.github/workflows/template-lint.yml'

permissions:
  contents: read

jobs:
  source-path-lint:
    name: Verify source paths in workflow templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check no template sources from sdlc/files/
        run: |
          set -euo pipefail
          # Every `source` statement in installed workflow templates must
          # resolve against scripts/ (the post-install path), not
          # sdlc/files/ (the repo-relative template path).
          # DevAudit-Installer#571 — Gap 2 prevention.
          if grep -r "source sdlc/files/" sdlc/files/ci/*.template; then
            echo ""
            echo "FAIL: workflow templates must source from scripts/ not sdlc/files/"
            echo "These paths do not exist after installation into a consumer project."
            exit 1
          fi
          echo "OK: no workflow template sources from sdlc/files/"

      - name: Run derive-release-version tests
        run: |
          chmod +x sdlc/files/_common/scripts/derive-release-version.sh
          bash sdlc/files/_common/scripts/derive-release-version.test.sh

      - name: Run release-scope integrity tests
        run: |
          chmod +x sdlc/files/_common/scripts/check-release-pr-scope.sh
          chmod +x sdlc/files/_common/scripts/standalone-housekeeping-release.sh
          chmod +x sdlc/files/_common/scripts/evaluate-npm-audit.sh
          bash sdlc/files/_common/scripts/check-release-pr-scope.test.sh
          bash sdlc/files/_common/scripts/list-reqs-in-range.test.sh
          bash sdlc/files/_common/scripts/check-deferred-reqs-in-range.test.sh
          bash sdlc/files/_common/scripts/provenance-gated-commit.test.sh
          bash sdlc/files/_common/scripts/standalone-housekeeping-release.test.sh
          bash sdlc/files/_common/scripts/evaluate-npm-audit.test.sh

      - name: Run bundled-changes and compliance-artifact validator tests
        run: |
          chmod +x sdlc/files/_common/scripts/generate-bundled-changes.sh
          chmod +x sdlc/files/_common/scripts/validate-compliance-artifacts.sh
          bash sdlc/files/_common/scripts/generate-bundled-changes.test.sh
          bash sdlc/files/_common/scripts/validate-compliance-artifacts.test.sh

      - name: Run declared-bundle single-release tests (devaudit-installer#955)
        run: |
          chmod +x sdlc/files/_common/scripts/resolve-bundle-release.sh
          chmod +x sdlc/files/_common/scripts/submit-bundle-manifest.sh
          chmod +x sdlc/files/_common/scripts/close-out-release.sh
          bash sdlc/files/_common/scripts/resolve-bundle-release.test.sh
          bash sdlc/files/_common/scripts/submit-bundle-manifest.test.sh
          bash sdlc/files/_common/scripts/close-out-release.test.sh

      - name: Run test tier script tests (devaudit-installer#1060)
        run: |
          chmod +x sdlc/files/_common/scripts/run-test-tier.sh
          bash sdlc/files/_common/scripts/run-test-tier.test.sh

      - name: Run evidence upload tests (devaudit-installer#1018)
        run: |
          chmod +x sdlc/files/_common/scripts/upload-evidence.sh
          chmod +x sdlc/files/_common/scripts/playwright-report-evidence.sh
          chmod +x sdlc/files/_common/scripts/classify-pr-attribution.sh
          bash sdlc/files/_common/scripts/classify-pr-attribution.test.sh
          bash sdlc/files/_common/scripts/upload-evidence.test.sh
          bash sdlc/files/_common/scripts/playwright-report-evidence.test.sh

      - name: Run required-gate triage tests (devaudit-installer#1016)
        run: |
          chmod +x sdlc/files/_common/scripts/validate-risk-acceptance-record.sh
          chmod +x sdlc/files/_common/scripts/reconcile-e2e-summary.sh
          chmod +x sdlc/files/_common/scripts/validate-test-summary.sh
          chmod +x sdlc/files/_common/scripts/report-test-execution.sh
          chmod +x sdlc/files/_common/scripts/render-test-executions.sh
          bash sdlc/files/_common/scripts/validate-risk-acceptance-record.test.sh
          bash sdlc/files/_common/scripts/reconcile-e2e-summary.test.sh
          bash sdlc/files/_common/scripts/validate-test-summary.test.sh
          bash sdlc/files/_common/scripts/report-test-execution.test.sh
          bash sdlc/files/_common/scripts/render-test-executions.test.sh

      - name: Run pre-push hook tests
        run: |
          chmod +x sdlc/files/stacks/node/hooks/pre-push
          bash sdlc/files/stacks/node/hooks/pre-push.test.sh

      - name: Check canonical release playbooks
        run: |
          chmod +x scripts/release-playbook-contract.test.sh
          bash scripts/release-playbook-contract.test.sh

      - name: Check release routing and action runtimes
        run: |
          bash scripts/release-routing-contract.test.sh
          bash scripts/action-runtime-contract.test.sh
          bash scripts/check-recovery-workflow.test.sh
          bash scripts/auto-merge-workflow.test.sh
          bash scripts/verify-auto-merge-checks.test.sh
          bash scripts/runner-host/runner-host.test.sh
          bash scripts/lint-shell-failure-modes.test.sh
          bash scripts/release-validation.test.sh
          bash scripts/lint-shell-failure-modes.sh sdlc/files

      - name: Run extract-release-metadata tests
        run: |
          chmod +x sdlc/files/_common/scripts/extract-release-metadata.sh
          bash sdlc/files/_common/scripts/extract-release-metadata.test.sh

      - name: Run close-out-reconcile tests
        run: |
          chmod +x sdlc/files/_common/scripts/close-out-reconcile.sh
          bash sdlc/files/_common/scripts/close-out-reconcile.test.sh

      - name: Run reconcile-deployment and provider lookup tests (devaudit-installer#1022)
        run: |
          chmod +x sdlc/files/_common/scripts/reconcile-deployment.sh sdlc/files/_common/scripts/lookup-deployment-railway.sh sdlc/files/_common/scripts/lookup-deployment-vercel.sh
          bash sdlc/files/_common/scripts/reconcile-deployment.test.sh
          chmod +x sdlc/files/_common/scripts/record-custom-deployment.sh
          bash sdlc/files/_common/scripts/record-custom-deployment.test.sh

      - name: Run release pipeline E2E fixture
        run: bash tests/release-pipeline-e2e/run.sh
