name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Used only when manually triggered.'
        required: true

permissions:
  contents: write   # for `gh release create`
  id-token: write   # for `npm publish --provenance` (SLSA)

jobs:
  publish:
    name: Publish 5 packages to npmjs.org + create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; actions/setup-node's
      # bundled npm on node 22 predates that, so upgrade explicitly. No
      # NPM_TOKEN / NODE_AUTH_TOKEN is used anywhere below — npm exchanges
      # this job's `id-token: write` OIDC token for a short-lived publish
      # token per-package, scoped to this exact repo + workflow file.
      - name: Ensure npm supports OIDC Trusted Publishing
        run: npm install -g npm@latest

      # ----- Step 1: plugin-sdk (no internal deps) -----
      - name: plugin-sdk — install + build + publish
        working-directory: plugin-sdk
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm publish --provenance --access public

      - name: Verify plugin-sdk is publicly installable
        run: bash scripts/verify-npm-publication.sh @metasession.co/devaudit-plugin-sdk "$(jq -r .version plugin-sdk/package.json)"

      # ----- Step 2: rewrite file:../plugin-sdk → ^X.Y.Z in dependents -----
      # The file: ref keeps local dev working from a fresh clone. At publish
      # time we swap it to the version we just published, so the published
      # tarballs depend on a real semver range rather than a missing path.
      # The swap is in-place but never committed back.
      - name: Pin plugin-sdk version in dependents
        run: |
          set -euo pipefail
          VER=$(jq -r .version plugin-sdk/package.json)
          echo "Pinning @metasession.co/devaudit-plugin-sdk to ^$VER in dependents"
          for dir in cli plugins/devaudit-plugin-prisma plugins/devaudit-plugin-evidence-export; do
            jq --arg v "^$VER" \
              '.dependencies["@metasession.co/devaudit-plugin-sdk"] = $v' \
              "$dir/package.json" > "$dir/package.json.tmp"
            mv "$dir/package.json.tmp" "$dir/package.json"
            echo "  $dir → $(jq -r '.dependencies["@metasession.co/devaudit-plugin-sdk"]' $dir/package.json)"
          done

      # ----- Step 3: cli -----
      - name: cli — install + build + publish
        working-directory: cli
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm publish --provenance --access public

      - name: Verify CLI is publicly installable
        run: bash scripts/verify-npm-publication.sh @metasession.co/devaudit-cli "$(jq -r .version cli/package.json)"

      # ----- Step 4: plugins -----
      - name: prisma plugin — install + build + publish
        working-directory: plugins/devaudit-plugin-prisma
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm publish --provenance --access public

      - name: Verify Prisma plugin is publicly installable
        run: bash scripts/verify-npm-publication.sh @metasession.co/devaudit-plugin-prisma "$(jq -r .version plugins/devaudit-plugin-prisma/package.json)"

      - name: evidence-export plugin — install + build + publish
        working-directory: plugins/devaudit-plugin-evidence-export
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm publish --provenance --access public

      - name: Verify evidence-export plugin is publicly installable
        run: bash scripts/verify-npm-publication.sh @metasession.co/devaudit-plugin-evidence-export "$(jq -r .version plugins/devaudit-plugin-evidence-export/package.json)"

      # ----- Step 5: devaudit-sdlc engine (#244) -----
      - name: devaudit-sdlc — publish
        working-directory: sdlc
        run: |
          npm publish --provenance --access public

      - name: Verify SDLC engine is publicly installable
        run: bash scripts/verify-npm-publication.sh @metasession.co/devaudit-sdlc "$(jq -r .version sdlc/package.json)"

      # ----- Step 6: GitHub Release with auto-generated notes -----
      # GITHUB_REF_NAME is set for both trigger types (the branch name on
      # workflow_dispatch, the tag name on a tag push) — it's never empty,
      # so a `${GITHUB_REF_NAME:-...}` fallback can't distinguish them and
      # would tag a manual dispatch's release as the branch name (e.g.
      # "main") instead of "v<version>". Branch explicitly on event_name.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "Creating GitHub Release $TAG"
          gh release create "$TAG" --generate-notes --title "$TAG"
