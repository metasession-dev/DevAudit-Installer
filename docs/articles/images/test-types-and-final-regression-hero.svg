<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0B1220"/><stop offset="100%" stop-color="#141E33"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5B8DEF"/><stop offset="100%" stop-color="#7FD1C8"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293F" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <text x="80" y="88" fill="#7FD1C8" font-size="22" letter-spacing="4" font-weight="600">DEVAUDIT.AI &#8226; TESTING</text>
  <rect x="80" y="108" width="120" height="4" fill="url(#accent)"/>
  <text x="80" y="190" fill="#F5F7FA" font-size="50" font-weight="800">Your last test should</text>
  <text x="80" y="250" fill="url(#accent)" font-size="50" font-weight="800">run after you deploy.</text>
  <text x="80" y="300" fill="#94A3B8" font-size="24" font-weight="500">Cheap checks first, wide checks last. Every failure is a recorded decision.</text>
  <rect x="80" y="345" width="220" height="34" rx="6" fill="#1E293F" stroke="#334155"/>
  <text x="96" y="368" fill="#F5F7FA" font-size="18" font-weight="700">Commit checks</text>
  <text x="314" y="368" fill="#64748B" font-size="17">every commit</text>
  <rect x="80" y="385" width="270" height="34" rx="6" fill="#1E293F" stroke="#334155"/>
  <text x="96" y="408" fill="#F5F7FA" font-size="18" font-weight="700">Unit</text>
  <text x="364" y="408" fill="#64748B" font-size="17">while building</text>
  <rect x="80" y="425" width="330" height="34" rx="6" fill="#1E293F" stroke="#334155"/>
  <text x="96" y="448" fill="#F5F7FA" font-size="18" font-weight="700">Feature E2E</text>
  <text x="424" y="448" fill="#64748B" font-size="17">PR to develop</text>
  <rect x="80" y="465" width="400" height="34" rx="6" fill="#1E293F" stroke="#334155"/>
  <text x="96" y="488" fill="#F5F7FA" font-size="18" font-weight="700">Smoke E2E</text>
  <text x="494" y="488" fill="#64748B" font-size="17">push to develop</text>
  <rect x="80" y="505" width="480" height="34" rx="6" fill="#1E293F" stroke="#334155"/>
  <text x="96" y="528" fill="#F5F7FA" font-size="18" font-weight="700">Critical E2E</text>
  <text x="574" y="528" fill="#64748B" font-size="17">PR to main</text>
  <rect x="80" y="545" width="580" height="34" rx="6" fill="url(#accent)"/>
  <text x="96" y="568" fill="#0B1220" font-size="18" font-weight="700">Full regression</text>
  <text x="674" y="568" fill="#64748B" font-size="17">after deploy</text>
  <text x="800" y="368" fill="#94A3B8" font-size="20" font-weight="600" letter-spacing="2">WHEN A GATE FAILS</text>
  <rect x="800" y="385" width="320" height="62" rx="8" fill="#141E33" stroke="#7FD1C8" stroke-width="2"/>
  <text x="818" y="412" fill="#7FD1C8" font-size="22" font-weight="800">FIX</text>
  <text x="818" y="435" fill="#CBD5E1" font-size="16">re-run green on the new head</text>
  <rect x="800" y="457" width="320" height="62" rx="8" fill="#141E33" stroke="#5B8DEF" stroke-width="2"/>
  <text x="818" y="484" fill="#5B8DEF" font-size="22" font-weight="800">ACCEPT</text>
  <text x="818" y="507" fill="#CBD5E1" font-size="16">written exception + review date</text>
  <rect x="800" y="529" width="320" height="62" rx="8" fill="#141E33" stroke="#F5B642" stroke-width="2"/>
  <text x="818" y="556" fill="#F5B642" font-size="22" font-weight="800">DEFER</text>
  <text x="818" y="579" fill="#CBD5E1" font-size="16">release parked, picked up on purpose</text>
  <circle cx="1080" cy="120" r="120" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.35"/>
  <circle cx="1080" cy="120" r="80" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.25"/>
</svg>
